name: 📰 한투 시황·공시 제목 수집 (연구 · 10분·40건)

# 사전 고정: docs/사전고정_2026-10-08_한투뉴스제목수집_v1.md — 사용자 지시 2026-10-08.
# 거래일 09:10~15:08 KST 10분 간격으로 최근 시황·공시 제목 40건을 받고 넘침 의심을 센다.
# 원본(제목·관련 종목)은 구글 드라이브 비공개. 운영 KIS 토큰(시트 칸)은 건드리지 않고 실행당 토큰 1회 발급, 공개 저장소에는 data/research_runs/ 의 건수·영수증만.
# 깃허브 예약은 몇 시간씩 늦을 수 있어 09:10·11:10·13:10 세 번 건다 — 같은 그룹에서 대기하다
# 15:08 이후 시작한 실행은 아무것도 하지 않고 끝난다. 휴장일이면 도구가 스스로 건너뛴다.
# 연구 전용: 선정 조건·주문·시트·운영 Gate 와 무관. 지문 대상 파일이 아니다.

on:
  workflow_dispatch:
    inputs:
      until:
        description: '조회 끝 시각 KST (HH:MM)'
        required: false
        default: '15:08'
  # 🔴 2026-10-08 실측: 09:10 깃허브 예약이 5시간 44분 늦은 14:54 에 시작해 조회가 2번뿐이었다.
  #    GAS 가 평일 12:25 쯤 띄우는 stockinfo7 수집 실행이 요청되면 이 수집도 함께 시작한다(늦어도 12시대 시작).
  #    연구 워크플로끼리의 연결이다 — 운영 워크플로(main.yml·ai_report.yml)에는 묶지 않는다.
  workflow_run:
    workflows: ["🗂️ 외부 테마 자료원 병행 수집 (stockinfo7 · 연구)"]
    types: [requested]
  schedule:
    - cron: '10 0 * * 1-5'   # 09:10 KST
    - cron: '10 2 * * 1-5'   # 11:10 KST (백업)
    - cron: '10 4 * * 1-5'   # 13:10 KST (백업)

permissions:
  contents: write

concurrency:
  group: kis-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.10'
    - run: pip install requests

    - name: 🔄 최신 상태 받기
      run: |
        git pull --ff-only origin main || echo "⚠️ 최신 main 으로 빨리감기 실패 — 이벤트 시점 상태로 진행"

    - name: 📰 수집 (원본 → 드라이브 비공개)
      env:
        KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
        KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        UNTIL: ${{ github.event.inputs.until }}
      run: |
        python hyeoks_kis_news.py --until "${UNTIL:-15:08}"

    - name: 💾 공개 건수 커밋
      if: always()
      run: |
        mkdir -p data/research_runs
        if [ -z "$(git status --porcelain data/research_runs)" ]; then
          echo "ℹ️ 바뀐 파일 없음 — 커밋 생략"; exit 0
        fi
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data/research_runs
        git commit -m "data: 한투 뉴스 수집 건수 $(TZ=Asia/Seoul date +%Y-%m-%d) run ${GITHUB_RUN_ID} [skip ci]"
        for i in 1 2 3; do
          git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
          echo "⚠️ 푸시 재시도 $i/3"; sleep 5
        done
        echo "::error::공개 건수 커밋 푸시 실패"; exit 1
