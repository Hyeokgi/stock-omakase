name: 🧱 HYEOKS 데이터 품질표 설치·갱신

# 목적: `데이터_품질표` 탭에 현재 버전의 수식을 올린다.
#
# ⚠️ **이 저장소에서 시트에 쓰는 몇 안 되는 워크플로다.** 그래서 안전장치를 셋 둔다.
#    ① 수동 실행만. 일정 트리거 없음
#    ② 기본은 모의 실행. 실제로 쓰려면 apply 를 켜고 탭 이름을 그대로 타이핑해야 한다
#    ③ sheetId 를 사람이 넣지 않는다. **이름으로 찾은 탭의 id 만** 쓰고,
#       쓰기 직전에 그 id 가 원장(`백테스트_로그`) id 와 다른지 다시 확인한다
#
# 원장은 어떤 경우에도 건드리지 않는다. 품질표 수식은 원장을 **읽기만** 한다.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: '실제로 쓴다 (끄면 모의 실행)'
        required: true
        default: false
        type: boolean
      confirm:
        description: "실제로 쓸 때만: 데이터_품질표 라고 그대로 입력"
        required: false
        default: ''
        type: string

concurrency:
  group: hyeoks-sheet-lock   # 💡 원장을 읽는 동안 스캐너가 쓰면 찢어진 읽기가 된다
  cancel-in-progress: false

permissions:
  contents: read             # 커밋하지 않는다. 산출물은 시트에만 남는다

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: 📥 코드 가져오기
      uses: actions/checkout@v4

    - name: 🐍 파이썬 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install gspread oauth2client

    - name: 🧪 자기검증
      # 원장 열 매핑과 설치 안전장치가 여기서 확인된다.
      # 깨진 상태로 시트에 쓰지 않는다.
      # ⚠️ 파이프를 쓰면 tail 의 종료코드가 남아 실패가 삼켜진다.
      #    (예전에 `git push || true` 로 같은 사고를 냈다) → 파이프 없이 그대로 돌린다.
      run: python -m unittest discover -s tests

    - name: 🔒 확인 문구 검사
      # apply 를 켜 놓고 문구를 안 적었으면 여기서 멈춘다.
      # 실수로 버튼을 누르는 것과 의도적으로 쓰는 것을 구분하는 유일한 장치다.
      if: ${{ inputs.apply }}
      run: |
        if [ "${{ inputs.confirm }}" != "데이터_품질표" ]; then
          echo "::error::확인 문구가 '데이터_품질표' 가 아니다. 아무것도 쓰지 않았다."
          exit 1
        fi

    - name: 🔑 비밀번호 파일(secret.json) 만들기
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      run: echo "$GCP_CREDENTIALS" > secret.json

    - name: 🧱 설치·갱신
      # --yes 가 없으면 대상 탭과 요청 수만 출력하고 끝난다.
      # 쓰기에 성공하면 이어서 연결 검사(--check 와 같은 것)를 돌린다.
      run: |
        python hyeoks_data_quality.py --install \
          --spreadsheet-id 1BcZ2HtkjlArbEGcRcMo8uKG1-ZQ-kv0RvNiiLJFQzks \
          ${{ inputs.apply && '--yes' || '' }}

    - name: 🧹 자격증명 삭제
      if: always()
      run: rm -f secret.json
