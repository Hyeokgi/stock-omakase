name: 📋 HYEOKS §6-4 모의 집행

# 목적: 15:05 스냅샷의 호가로 슬리피지 하한과 체결 가능성을 실측한다.
#       §4-4 의 교훈 — "상한가 안착 7건이 수익의 대부분을 만들었는데 그 종목은 살 수가 없다.
#       체결 가능성은 수익률 표에 안 보인다" — 를 숫자로 만드는 단계다.
#
# 주문을 내지 않는다. 계좌에 접근하지 않는다. 시트도 안 건드린다. 이름 그대로 모의다.
# 입력은 저장소에 이미 커밋된 스냅샷 파일이므로 자격증명이 필요 없다.

on:
  workflow_dispatch:
    inputs:
      date:
        description: '분석할 날짜 YYYY-MM-DD (비우면 최신 15:05 스냅샷)'
        required: false
        type: string
      order:
        description: '주문 가정 금액(원). 기본 1억'
        required: false
        default: '100000000'
        type: string
  schedule:
    # 평일 17:00 KST (08:00 UTC) — 15:05 스냅샷이 커밋된 뒤에 돈다.
    # 스냅샷과 달리 정시성이 필요 없다(이미 저장된 파일을 읽을 뿐이라 늦어도 값이 같다).
    - cron: '0 8 * * 1-5'

concurrency:
  group: hyeoks-paperfill-lock   # 시트를 안 쓰므로 다른 워크플로와 분리
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paper-fill:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: 📥 코드 가져오기
      uses: actions/checkout@v4

    - name: 🐍 파이썬 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: 🧪 계산식 자기검증
      run: python hyeoks_paper_fill.py --self-test

    - name: 📋 모의 집행
      id: run
      run: |
        set +e
        D=""
        if [ -n "${{ inputs.date }}" ]; then D="--date ${{ inputs.date }}"; fi
        python hyeoks_paper_fill.py $D --order "${{ inputs.order || '100000000' }}" 2>&1 | tee pf.txt
        echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        exit 0

    - name: 📋 실행 로그 보관
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: paper-fill-log
        path: pf.txt
        retention-days: 90

    - name: 💾 리포트 커밋
      run: |
        if [ -z "$(git status --porcelain data/paper_fill)" ]; then
          echo "ℹ️ 새 리포트 없음 — 커밋 생략"
          exit 0
        fi
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data/paper_fill
        git commit -m "data: §6-4 모의 집행 $(TZ=Asia/Seoul date +%Y-%m-%d) [skip ci]"
        for i in 1 2 3; do
          git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
          echo "⚠️ 푸시 재시도 $i/3"
          sleep 5
        done
        echo "❌ 푸시 실패"
        exit 1

    - name: 🚦 실패 시 잡 실패 처리
      if: always()
      run: |
        # 호가 열이 없는 날(2026-08-28 이전 스냅샷)은 정상적인 스킵이므로 실패로 안 본다.
        if [ "${{ steps.run.outputs.exit_code }}" != "0" ]; then
          if grep -q "필요한 열이 없습니다" pf.txt; then
            echo "ℹ️ 호가 열이 없는 스냅샷 — 정상 스킵"
            exit 0
          fi
          echo "❌ 모의 집행이 0이 아닌 코드로 종료했습니다"
          exit 1
        fi
        echo "✅ 정상 종료"
