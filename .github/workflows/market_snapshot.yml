name: 📸 HYEOKS 장중 시장 스냅샷

# 목적: 하루 두 번 시장 전체를 찍어 저장한다. 두 스냅샷의 차이가 곧 '오후 수급'이다.
#       "고수의 종가베팅" 조건을 검증하려면 (a) 그날 시장 전체의 주도주가 무엇이었는지와
#       (b) 오후에 수급이 유지됐는지가 필요한데, 지금 우리에겐 둘 다 기록이 없다.
#       백테스트_로그에는 '우리 스캐너가 고른 종목'만 있어서 유니버스 자체를 검증할 수 없고,
#       일봉으로는 오전/오후를 구분할 수 없다.
#
# 관측 전용: 구글시트를 읽지도 쓰지도 않는다. 선정 로직에 어떤 영향도 없다.
#            → 시트 락 불필요, 9/7 판정 기준선 무영향.
#
# ⚠️ 파일 첫 줄에 실제 캡처 시각(capturedAt)을 기록한다. 파일명의 슬롯은 '의도한 시각'일 뿐이니
#    분석할 때는 반드시 capturedAt 을 기준으로 삼을 것.
#    스크립트에 시간 창 가드가 있어 창(1300: 12:40~13:40 / 1505: 14:50~15:25) 밖이면 저장을 거부한다.
#    늦게 도착한 실행이 '그냥 종가 스냅샷'으로 표본에 섞이는 것을 막기 위함이다.

# 🔔 트리거는 GAS 가 쏜다 (매크로.gs 의 triggerMarketSnapshot1300 / 1505).
#    깃허브 cron 을 쓰지 않는 이유 — 지연이 너무 크다.
#    2026-08-27 실측: 정적데이터 4시간 54분, 캘린더 4시간 45분 지연. 그날 스냅샷 예약분은
#    아예 드롭됐다. 15:05 스냅샷은 '동시호가 직전'이라는 게 핵심이라 지연을 감당할 수 없다.
#    GAS 시간 기반 트리거는 구글 인프라에서 돌아 지터가 ±15분 수준이다.
#
# 🪃 백업 발사 (2026-08-29 추가) — GAS 가 죽은 날을 위한 두 번째 시도.
#    GAS 는 단일 실패점이고, 스냅샷은 놓치면 **영구 복원 불가**다. 그래서 슬롯마다
#    깃허브 cron 을 하나씩 더 건다. 깃허브 cron 은 늦지만, 늦으면 스크립트의 시간 창
#    가드가 알아서 저장을 거부하므로 **표본이 오염될 위험은 0 이고 얻을 것만 있다.**
#    이미 그 슬롯 파일이 있으면 중복 가드가 걸려 그냥 종료한다(스크립트 649행).
#
#    발사 시각은 '정시 도착이 가장 좋은 값'이 되도록 잡았다.
#      1300 → 13:20 KST 발사, 창 마감 13:40 까지 약 18분의 지연 여유
#      1505 → 15:05 KST 발사, 창 마감 15:25 까지 약 18분의 지연 여유
#    둘 다 GAS 정시 발사(13:02 / 15:02)보다 **뒤**에 둔다. GAS 가 정상이면
#    중복 가드에 걸려 조용히 끝나고, GAS 가 죽은 날에만 실제로 찍힌다.
on:
  schedule:
    # ⚠️ 2026-09-01 실측: 이 백업은 **아직 한 번도 제 시간에 도착하지 못했다.**
    #    8/31 발사 기록 — 04:20 예약분이 10:56 UTC(6시간 36분 지연),
    #                    06:05 예약분이 12:59 UTC(6시간 54분 지연) 도착.
    #    둘 다 시간 창 가드에 걸려 저장이 거부됐다(=표본 오염은 0, 설계대로).
    #    즉 지금 이 cron 은 **보험이 아니라 빈 보험증서**다.
    #    깃허브 cron 은 인기 있는 분(:00/:05/:15/:20/:30/:45)에 몰려 큐가 밀린다는
    #    보고가 많아, 한 번만 비인기 분으로 바꿔 재측정한다(:17 / :07).
    #    ⛔ 이걸로도 안 되면 cron 은 해법이 아니다. 진짜 해법은 GAS 트리거를
    #       슬롯마다 하나씩 더 다는 것이다(GAS 지터는 ±15분이라 창 안에 들어온다).
    - cron: '17 4 * * 1-5'   # 13:17 KST — 1300 슬롯 백업
    - cron: '7 6 * * 1-5'    # 15:07 KST — 1505 슬롯 백업
  workflow_dispatch:
    inputs:
      slot:
        description: '스냅샷 슬롯 (1300 | 1505 | manual)'
        required: true
        default: '1505'
        type: choice
        options: ['1300', '1505', 'manual']
      force:
        description: '휴장일·시간창 판정을 무시하고 저장 (테스트용)'
        required: false
        default: false
        type: boolean

concurrency:
  group: hyeoks-snapshot-lock   # 시트를 안 쓰므로 다른 워크플로와 분리
  cancel-in-progress: false

permissions:
  contents: write               # 스냅샷 파일을 저장소에 커밋해야 함

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: 📥 코드 가져오기
      uses: actions/checkout@v4

    - name: 🐍 파이썬 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: 🎯 슬롯 결정
      # schedule 로 들어오면 inputs 가 비어 있으므로 cron 식으로 슬롯을 되짚는다.
      id: slot
      run: |
        case "${{ github.event.schedule }}" in
          "17 4 * * 1-5") SLOT=1300 ;;
          "7 6 * * 1-5")  SLOT=1505 ;;
          *)              SLOT="${{ inputs.slot }}" ;;
        esac
        if [ -z "$SLOT" ]; then
          echo "❌ 슬롯을 정할 수 없다 (schedule='${{ github.event.schedule }}', input 없음)"
          exit 1
        fi
        echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
        echo "▶ slot=$SLOT (트리거: ${{ github.event_name }})"

    - name: 📸 스냅샷 수집
      id: snap
      run: |
        set +e
        FORCE=""
        if [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
        # 시간 창 밖이거나 휴장일이면 스크립트가 스스로 저장을 거부하고 0으로 끝난다.
        # 백업 cron 이 늦게 도착한 경우가 바로 여기서 걸러진다 — 빈손이 오염보다 낫다.
        python hyeoks_market_snapshot.py --slot "${{ steps.slot.outputs.slot }}" $FORCE
        echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        exit 0

    - name: 💾 저장소에 커밋
      run: |
        if [ -z "$(git status --porcelain data/market_snapshot)" ]; then
          echo "ℹ️ 새 파일 없음 (휴장일·시간창 밖·중복·수집실패) — 커밋 생략"
          exit 0
        fi
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data/market_snapshot
        git commit -m "data: 시장 스냅샷 $(TZ=Asia/Seoul date +%Y-%m-%d) slot=${{ steps.slot.outputs.slot }} [skip ci]"
        # 다른 워크플로/사람이 그 사이 푸시했을 수 있으므로 rebase 후 재시도
        for i in 1 2 3; do
          git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
          echo "⚠️ 푸시 재시도 $i/3"
          sleep 5
        done
        echo "❌ 푸시 실패"
        exit 1
