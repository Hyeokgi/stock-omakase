name: 📸 HYEOKS 장중 시장 스냅샷

# 목적: 하루 두 번 시장 전체를 찍어 저장한다. 두 스냅샷의 차이가 곧 '오후 수급'이다.
#       "고수의 종가베팅" 조건을 검증하려면 (a) 그날 시장 전체의 주도주가 무엇이었는지와
#       (b) 오후에 수급이 유지됐는지가 필요한데, 지금 우리에겐 둘 다 기록이 없다.
#       백테스트_로그에는 '우리 스캐너가 고른 종목'만 있어서 유니버스 자체를 검증할 수 없고,
#       일봉으로는 오전/오후를 구분할 수 없다.
#
# 관측 전용: 구글시트를 읽지도 쓰지도 않는다. 선정 로직에 어떤 영향도 없다.
#            → 시트 락 불필요, 9/7 판정 기준선 무영향.
#
# ⚠️ 깃허브 cron 은 정시에 안 돈다(10~20분 지연이 흔하다). 그래서 파일 첫 줄에
#    실제 캡처 시각(capturedAt)을 기록한다. 분석 시 그 값을 기준으로 삼을 것.

on:
  schedule:
    - cron: '0 4 * * 1-5'    # 13:00 KST — 오전장 마감 시점
    - cron: '5 6 * * 1-5'    # 15:05 KST — 동시호가(15:20) 직전
  workflow_dispatch:
    inputs:
      tag:
        description: '스냅샷 태그 (수동 실행 시)'
        required: false
        default: 'manual'
        type: string
      force:
        description: '휴장일 판정을 무시하고 저장'
        required: false
        default: false
        type: boolean

concurrency:
  group: hyeoks-snapshot-lock   # 시트를 안 쓰므로 다른 워크플로와 분리
  cancel-in-progress: false

permissions:
  contents: write               # 스냅샷 파일을 저장소에 커밋해야 함

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: 📥 코드 가져오기
      uses: actions/checkout@v4

    - name: 🐍 파이썬 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: 🏷️ 태그 결정
      id: tag
      run: |
        # 예약 실행이면 현재 KST 시각(HHMM)을, 수동이면 입력값을 쓴다.
        if [ "${{ github.event_name }}" = "schedule" ]; then
          echo "value=$(TZ=Asia/Seoul date +%H%M)" >> "$GITHUB_OUTPUT"
        else
          echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
        fi

    - name: 📸 스냅샷 수집
      id: snap
      run: |
        set +e
        FORCE=""
        if [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
        python hyeoks_market_snapshot.py --tag "${{ steps.tag.outputs.value }}" $FORCE
        echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        exit 0

    - name: 💾 저장소에 커밋
      run: |
        if [ -z "$(git status --porcelain data/market_snapshot)" ]; then
          echo "ℹ️ 새 파일 없음 (휴장일이거나 수집 실패) — 커밋 생략"
          exit 0
        fi
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data/market_snapshot
        git commit -m "data: 시장 스냅샷 $(TZ=Asia/Seoul date +%Y-%m-%d_%H%M) [skip ci]"
        # 다른 워크플로/사람이 그 사이 푸시했을 수 있으므로 rebase 후 재시도
        for i in 1 2 3; do
          git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
          echo "⚠️ 푸시 재시도 $i/3"
          sleep 5
        done
        echo "❌ 푸시 실패"
        exit 1
