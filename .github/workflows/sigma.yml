name: 📏 HYEOKS 설계별 σ 실측

# 목적: 검증에 며칠이 필요한지는 σ 가 정한다.
#       docs/검증가속계획_2026-09-16.md §0 의 σ 는 ① 하나만 실측이고 나머지는 가정이었다.
#       이 워크플로가 그 가정을 실측으로 바꾼다.
#
# ⚠️ 판정이 아니다. σ(잡음)만 재고 설계별 t·p·유의성은 계산하지 않는다 —
#    여러 설계의 유의성을 보고 고르면 p-해킹이다. 판정은 verdict 가 한다.
#
# 읽기 전용: 시트를 읽기만 한다. 락은 메인 스캐너와 공유한다(찢어진 읽기 방지).

on:
  workflow_dispatch:

concurrency:
  group: hyeoks-sheet-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sigma:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: 📦 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install gspread oauth2client

    - name: 🧪 자기검증
      run: |
        python hyeoks_sigma.py --self-test
        python -m unittest discover -s tests -p 'test_sigma.py'

    - name: 🔑 비밀번호 파일(secret.json) 만들기
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      run: echo "$GCP_CREDENTIALS" > secret.json

    - name: 📏 σ 실측
      id: run
      run: |
        set +e
        python hyeoks_sigma.py 2>&1 | tee sigma.txt
        echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        exit 0

    - name: 🧹 자격증명 삭제
      if: always()
      run: rm -f secret.json

    - name: 📋 실행 로그 보관
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: sigma-log
        path: sigma.txt
        retention-days: 90

    - name: 💾 리포트 커밋
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/ || true
        git diff --staged --quiet || git commit -m "docs: 설계별 σ 실측 $(date -u +%Y-%m-%d) [skip ci]"
        git push

    - name: 🚦 실패 시 잡 실패
      run: |
        if [ "${{ steps.run.outputs.exit_code }}" != "0" ]; then
          echo "❌ 0이 아닌 코드로 종료"
          exit 1
        fi
        echo "✅ 정상 종료"
