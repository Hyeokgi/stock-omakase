name: 🧬 채널 코호트 경계 확인

# 목적: §3-5-7 U3 의 숙제를 **원장의 사실로** 답한다.
#
#   U3 은 정책 동일성을 채널별로 보기로 했다. 그러려면 채널마다 선정 정의가
#   언제 바뀌었는지 알아야 하는데, `수급TOP2` 의 위치요건 제거는 **git 이전**이라
#   코드 이력으로 날짜를 못 짚는다(최초 커밋 f305c01 = 2026-08-04 에 이미 현재 형태).
#
#   그래서 질문을 답할 수 있는 형태로 바꿨다:
#     "판정 표본 중 2026-08-04 보다 이른 진입일이 하나라도 있는가"
#   없으면 전 구간이 git 이 보증하는 동일 게이트 아래 생성된 단일 코호트다.
#
# 읽기 전용: 원장을 **읽기만** 한다. 자기검증이 소스에 쓰기 호출이 없다는 것과,
#            3열 뒤(수익률 등) 값이 무엇이든 결과가 안 바뀐다는 것까지 확인한다.
#            성과를 보고 경계를 정하면 사후 맞춤이 되기 때문이다.
#
# 수동 전용: cron 이 없다. 경계는 한 번 확정하면 되는 것이지 매일 물을 일이 아니다.
#
# 이 워크플로는 코호트를 **확정하지 않는다.** 증거를 보여줄 뿐이고
# 확정은 사전등록 문서 갱신(사람의 결정)으로 한다.

on:
  workflow_dispatch:

concurrency:
  group: hyeoks-sheet-lock        # 스캐너가 쓰는 중에 읽으면 찢어진 상태를 본다
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: 📥 코드 가져오기
      uses: actions/checkout@v7

    - name: 🐍 파이썬 세팅
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: 📦 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install gspread oauth2client

    - name: 🧪 자기검증 (시트 접근 없음)
      run: python hyeoks_cohort_probe.py --self-test

    - name: 🔑 비밀번호 파일(secret.json) 만들기
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      run: echo "$GCP_CREDENTIALS" > secret.json

    - name: 🧬 코호트 경계 확인 (읽기 전용)
      run: python hyeoks_cohort_probe.py

    - name: 🧹 자격증명 삭제
      if: always()
      run: rm -f secret.json
