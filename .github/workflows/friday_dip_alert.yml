name: 🌙 금요일 밤 하락 알림 (참고 · 19:40)

# 사용자 지시 2026-10-23 — 금요일 급등주(KRX 10%↑ 29.5% 미만 · 거래대금 500억↑) 거래대금 1~2위가
# 19:40 에 KRX 종가 대비 3% 이상 빠졌으면(NXT · KRX 애프터마켓) 텔레그램 채널로 알린다. 빠진 종목이 없으면 보내지 않는다.
# 주 발사는 GAS 금요일 19:00 workflow_dispatch(docs/collaboration/2026-10-23_Claude_금요일밤하락알림.md).
# 깃허브 예약은 몇 시간씩 늦을 수 있어(10/8 실측 5시간 44분) 18:00 · 19:15 를 백업으로 건다.
# 같은 그룹에서 대기하다 앞 실행이 이미 확인했으면 아무것도 하지 않는다. 19:58 이 지나 시작하면 생략한다.
# 실행당 KIS 토큰 1회 발급(운영 토큰 · 시트 칸은 건드리지 않는다). 공개 저장소에는 data/research_runs/friday_dip_runs.csv 의 건수만.
# 참고 알림 전용: 선정 조건 · 주문 · 시트 · 운영 Gate 와 무관. 지문 대상 파일이 아니다.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 5'     # 금 18:00 KST (백업)
    - cron: '15 10 * * 5'   # 금 19:15 KST (백업)

permissions:
  contents: write

concurrency:
  group: friday-dip
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 200

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.10'
    - run: pip install requests

    - name: 🔄 최신 상태 받기
      run: |
        git pull --ff-only origin main || echo "⚠️ 최신 main 으로 빨리감기 실패 — 이벤트 시점 상태로 진행"

    - name: 🌙 후보 확인 → 19:40 가격 → 알림
      env:
        KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
        KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      run: |
        python hyeoks_friday_dip_alert.py

    - name: 💾 공개 건수 커밋
      if: always()
      run: |
        mkdir -p data/research_runs
        if [ -z "$(git status --porcelain data/research_runs)" ]; then
          echo "ℹ️ 바뀐 파일 없음 — 커밋 생략"; exit 0
        fi
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data/research_runs
        git commit -m "data: 금요일 밤 하락 알림 기록 $(TZ=Asia/Seoul date +%Y-%m-%d) run ${GITHUB_RUN_ID} [skip ci]"
        for i in 1 2 3; do
          git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
          echo "⚠️ 푸시 재시도 $i/3"; sleep 5
        done
        echo "::error::공개 건수 커밋 푸시 실패"; exit 1
