name: 🩺 HYEOKS 네이버 의존 진단

# 목적: 네이버 의존 지점과 대표 시세/수급의 신선도를 매주 자동 점검한다.
#       단순 HTTP 200이 아니라 "우리가 파싱해 쓰는 값이 실제로 나오는가"까지 확인하고,
#       구 원천 회귀는 로그로 보존하고 기능 단위 판정 JSON으로 알림을 결정한다.
# 알림: 문제가 있을 때만 텔레그램으로 보낸다(정상이면 조용 — 주간 알림 피로 방지).
#       실행 여부 자체는 Actions 탭 이력으로 확인할 것.
# 주의: 이 워크플로는 구글시트를 건드리지 않는다(읽기도 안 함). 순수 네트워크 점검이라
#       시트 락 그룹과 분리했다.

on:
  schedule:
    - cron: '0 1 * * 1'   # 매주 월요일 10:00 KST (01:00 UTC) — 장중이라 엔드포인트가 '실사용' 상태
  workflow_dispatch:      # 개편일 등 필요할 때 수동 실행 (Actions 탭 → Run workflow)

concurrency:
  group: hyeoks-healthcheck-lock   # 시트를 안 쓰므로 다른 워크플로와 락을 공유할 이유가 없다
  cancel-in-progress: false

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: 📥 코드 가져오기
      uses: actions/checkout@v7

    - name: 🐍 파이썬 세팅
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: 📦 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: 🩺 진단 실행 (기준선 대비 회귀 탐지)
      id: check
      run: |
        set +e
        python hyeoks_naver_healthcheck.py --compare 2>&1 | tee result.txt
        echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        exit 0

    - name: 📋 결과 보관
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: healthcheck-result
        path: |
          result.txt
          health_report.json
        retention-days: 90

    - name: 📢 이상 시 텔레그램 알림 + 잡 실패 처리
      if: always()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        EXIT_CODE: ${{ steps.check.outputs.exit_code }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        python notify_naver_health.py
