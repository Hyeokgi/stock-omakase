name: ⚖️ HYEOKS 채널 판정 스냅샷

# 목적: 로드맵 §3 이 사전등록한 규칙 그대로 채널별 판정표를 만들어 **박제**한다.
#       9/7 판정일의 산출물이며, §3-7 이 "그날 값 그대로, 이후 수정 금지"로 정한 표다.
#
# 읽기 전용: 구글시트를 **읽기만** 한다. 쓰지 않는다.
#            그래도 락은 메인 스캐너와 공유한다 — omakase 가 백테스트_로그를 갱신하는
#            도중에 읽으면 절반만 갱신된 상태를 볼 수 있다(찢어진 읽기 방지).
#
# 수동 전용: cron 이 없다. 판정은 정해진 날에 사람이 판단해서 돌리는 것이다.
#            매일 자동으로 돌리면 '결과를 매일 보는' 습관이 생기고,
#            그게 사전등록 규율(§3)이 막으려는 바로 그 행동이다.

on:
  workflow_dispatch:
    inputs:
      stdout_only:
        description: '파일로 저장하지 않고 화면에만 (리허설용 — 커밋 안 함)'
        required: false
        default: false
        type: boolean

concurrency:
  group: hyeoks-sheet-lock
  cancel-in-progress: false

permissions:
  contents: write            # 판정 스냅샷을 저장소에 박제

jobs:
  verdict:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: 📥 코드 가져오기
      uses: actions/checkout@v4

    - name: 🐍 파이썬 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install gspread oauth2client

    - name: 🧪 통계·판정 로직 자기검증
      # 시트를 건드리기 전에 t분포·Welch·Holm·문턱을 검증한다.
      # 여기서 깨지면 판정을 신뢰할 수 없으므로 돌릴 이유가 없다.
      run: python hyeoks_verdict.py --self-test

    - name: 🔑 비밀번호 파일(secret.json) 만들기
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      run: echo "$GCP_CREDENTIALS" > secret.json

    - name: ⚖️ 판정 스냅샷 생성
      id: run
      run: |
        set +e
        FLAG=""
        if [ "${{ inputs.stdout_only }}" = "true" ]; then FLAG="--stdout-only"; fi
        python hyeoks_verdict.py $FLAG 2>&1 | tee verdict.txt
        echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        exit 0

    - name: 🧹 자격증명 삭제
      if: always()
      run: rm -f secret.json

    - name: 📋 실행 로그 보관
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: verdict-log
        path: verdict.txt
        retention-days: 365   # 판정 근거는 오래 남긴다

    - name: 💾 판정 스냅샷 박제
      if: ${{ inputs.stdout_only != true }}
      run: |
        if [ -z "$(git status --porcelain docs)" ]; then
          echo "ℹ️ 새 스냅샷 없음 — 커밋 생략"
          exit 0
        fi
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add docs
        git commit -m "data: 채널 판정 스냅샷 $(TZ=Asia/Seoul date +%Y-%m-%d) — 박제, 수정 금지 [skip ci]"
        for i in 1 2 3; do
          git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
          echo "⚠️ 푸시 재시도 $i/3"
          sleep 5
        done
        echo "❌ 푸시 실패"
        exit 1

    - name: 📌 판정 요약 다시 찍기 (로그 맨 끝)
      # 액션 로그를 tail 로 볼 때 보일러플레이트에 밀리지 않도록 핵심만 재출력한다.
      if: always()
      run: |
        echo "════════ 판정 요약 ════════"
        # 성공하면 요약 구간을, 실패하면 마지막 30줄(=트레이스백)을 찍는다.
        # 첫 실행에서 sed 가 아무것도 못 찾아 원인 파악이 한 번 밀렸다.
        if grep -q "판정 요약" verdict.txt 2>/dev/null; then
          sed -n '/판정 요약/,$p' verdict.txt
        else
          echo "⚠️ 요약 구간 없음 — 실패한 것으로 보고 로그 끝부분을 찍는다"
          tail -n 30 verdict.txt || true
        fi

    - name: 🚦 실패 시 잡 실패 처리
      if: always()
      run: |
        if [ "${{ steps.run.outputs.exit_code }}" != "0" ]; then
          echo "❌ 판정 스크립트가 0이 아닌 코드로 종료했습니다 (로그 확인)"
          exit 1
        fi
        echo "✅ 정상 종료"
