name: 📈 HYEOKS Mid-Term Trend Analyzer

on:
  schedule:
    # KST 토·일 22시. Codex 수집은 21시; 수집 성공 여부와 별개로 기존 미분석 큐 처리.
    - cron: '0 13 * * 6,0'
  workflow_dispatch: # 깃허브 웹에서 수동으로 버튼을 눌러 즉시 실행할 수 있게 하는 옵션

concurrency:
  group: hyeoks-sheet-lock
  cancel-in-progress: false

jobs:
  analyze_reports:
    runs-on: ubuntu-latest
    
    timeout-minutes: 60  # 실행당 8건 + 새 요청 시작 20분 제한. 느린 단일 요청의 하드 백스톱.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'   # 💡 3.10에서 3.11로 변경 (버전 경고 메시지 해결)

      - name: Install dependencies
        run: |
          pip install google-genai gspread oauth2client google-api-python-client # 💡 google-genai 로 최신 패키지 이름 수정

      # Secret is passed via environment, never interpolated into shell source.
      - name: Create secret.json
        env:
          CREDENTIAL_JSON: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          python -c 'import os,json,pathlib; pathlib.Path("secret.json").write_text(json.dumps(json.loads(os.environ["CREDENTIAL_JSON"])), encoding="utf-8")'
      - name: Run Trend Analyzer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_REPORTS_PER_RUN: '8'
        run: python hyeoks_trend.py
      - name: Remove credentials
        if: always()
        run: python -c 'from pathlib import Path; Path("secret.json").unlink(missing_ok=True)'
