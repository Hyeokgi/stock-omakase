name: 📈 HYEOKS Mid-Term Trend Analyzer

on:
  schedule:
    # 매주 토요일, 일요일 한국 시간 오전 10시 가동 (UTC 기준 01:00)
    # 🔧 [교정] 예전 '5,6'은 cron 요일 규칙(0=일…5=금,6=토)상 UTC 금·토 = KST 금·토였다.
    #    금요일 10시는 장중이라, DB_중장기를 통째로 지우고 다시 쓰는 이 작업이 돌 때
    #    omakase(10분마다 코어픽 조회)·analyst가 빈 시트를 읽을 위험이 있었다.
    #    주석대로 KST 토·일로 옮겨(=UTC 6,0) 주말 가드가 걸린 시간대에만 돌게 한다.
    - cron: '0 1 * * 6,0'
  workflow_dispatch: # 깃허브 웹에서 수동으로 버튼을 눌러 즉시 실행할 수 있게 하는 옵션

jobs:
  analyze_reports:
    runs-on: ubuntu-latest
    
    timeout-minutes: 60  # 💡 [하드 백스톱] 분석 대상이 많은 주에는 20분으로 부족해 중간에 잘렸음 → 1시간으로 상향.
                         #    (스크립트에 자체 시간 예산이 없으므로 이 값이 유일한 상한)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'   # 💡 3.10에서 3.11로 변경 (버전 경고 메시지 해결)

      - name: Install dependencies
        run: |
          pip install google-genai gspread oauth2client google-api-python-client # 💡 google-genai 로 최신 패키지 이름 수정

      # 💡 깃허브가 큰따옴표를 지우지 못하도록 안전하게 파일 생성 (cat EOF 방식)
      - name: Create secret.json
        run: |
          cat << 'EOF' > secret.json
          ${{ secrets.GCP_CREDENTIALS }}
          EOF
      - name: Run Trend Analyzer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python hyeoks_trend.py
