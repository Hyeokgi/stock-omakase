name: 📊 HYEOKS 실적 PRIMARY (DART → DB_실적)

# 🔴 2026-09-18 GPT §5 — 주 산출물 전용. 보조(컨센서스)는 consensus_aux.yml.
#    하나의 워크플로가 빨간불이면 투자 핵심 데이터가 죽었는지 보조자료가
#    죽었는지 로그를 열어봐야 했다. 이제 **이름으로** 구분된다.

on:
  schedule:
    - cron: '0 11 * * *'   # 매일 20:00 KST (11:00 UTC) — 새벽 시간대(04:00)에 DART 접속이 계속 실패해서 저녁으로 이동해봄
  workflow_dispatch:        # 수동으로 바로 돌려서 테스트하고 싶을 때
    inputs:
      cycle_date:
        description: '지연 실행의 명시적 거래일 YYYY-MM-DD (평시 비움)'
        required: false

concurrency:
  group: hyeoks-earnings-lock  # 🔧 [수정] omakase.py와 같은 락(hyeoks-sheet-lock)을 썼다가, 이 스크립트가
  #    DART API 불통으로 몇 시간씩 안 끝나면 스캐너 트리거들이 대기열에 밀려 취소되는 연쇄를 겪었음
  #    (2026-07 사고). 실제로 겹치는 시트가 없어서(DB_실적·DB_기업코드매핑만 건드림) 같은 락을 쓸 이유가
  #    없었음 — 전용 락으로 분리해서 서로 절대 안 막도록 함.
  cancel-in-progress: false

permissions:
  contents: write   # 영수증 보존(P0-1)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 💡 [하드 백스톱] 30분도 여유가 부족해서 1시간으로 상향 (내부 시간 예산도 55분으로 맞춤)

    steps:
    - name: 📥 코드 가져오기
      uses: actions/checkout@v7

    - name: 🐍 파이썬 세팅
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: 📦 필수 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install gspread oauth2client requests beautifulsoup4

    - name: 🚀 구글 시트 보안 인증 파일(secret.json) 생성
      env:
        SECRET_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
      run: |
        echo "$SECRET_JSON" > secret.json

    - name: 📊 DART 확정치 → DB_실적 (주 산출물)
      env:
        DART_API_KEY: ${{ secrets.DART_API_KEY }}
        PRODUCTION_CYCLE_DATE: ${{ inputs.cycle_date }}
      run: |
        python hyeoks_earnings_collector.py --phase primary

    # 🔴 2026-09-18 GPT P0-2/P0-3 — 본표 쓰기를 막았을 때 오늘 수집분을 잃지 않는다.
    #    컨테이너는 사라지므로 파일만 써 두는 것으로는 부족하다. artifact 로 꺼낸다.
    #    (막힌 경우에만 파일이 생기므로 평소엔 이 스텝이 조용히 지나간다)
    - name: 🧷 본표 쓰기가 막혔다면 수집분 보존
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: earnings-staging-${{ github.run_id }}
        path: data/earnings_staging/
        if-no-files-found: ignore
        retention-days: 30

    - name: 🧾 영수증 보존 (Gate 증거 · P0-1)
      if: always()
      run: bash .github/receipt_commit.sh earnings
