name: Priority paper trials - offline tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - priority_trials.py
      - tests/test_priority_trials.py
      - .github/workflows/priority_trials_tests.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -p 'test_priority_trials.py'
