name: Stock Omakase Auto Scraper

on:
  workflow_dispatch: # 구글 GAS가 쏘는 신호만 받음 (시간 없음)
  
concurrency:
  group: hyeoks-sheet-lock # 💡 퍼블리셔와 똑같은 이름으로 맞춥니다!
  cancel-in-progress: false

permissions:
  contents: write   # 타점 전수조사 한 줄을 커밋하기 위해서만 쓴다 (아래 마지막 스텝)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 17  # 💡 [하드 백스톱] 코드 내 15분 자체 데드라인이 어떤 이유로든 안 걸리면 GitHub가 강제 종료 → 다음 대기열이 밀리지 않게 보장
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # 🔒 2026-10-25 — 공개 영수증 거래 ID 가리기(HMAC) · 후보 자료 업로드 실패 시 암호화 사본에 쓰는 키
      PRIVATE_STORE_KEY: ${{ secrets.PRIVATE_STORE_KEY }}
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # P1-1 — 지문 증거가 `git diff <sha>..HEAD` 를 쓴다

      - name: 파이썬 설치하기
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: 라이브러리 설치하기
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas gspread oauth2client kiwipiepy

      - name: 🚦 지문 기준 audit CI 증거 (P1-1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 🔴 P1-1 — HEAD SHA 로 찾으면 데이터 전용 커밋([skip ci]) 뒤에는 CI 가
          #    없어서 정상 코드인데도 증거가 사라진다. 매일 데이터가 커밋되므로
          #    사실상 항상 거짓이 된다. 증명할 것은 "지금 **지문**이 CI 를 통과했나" 다.
          set +e
          RUNS=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/review_regressions.yml/runs?status=success&branch=main&per_page=10" \
            | python -c "import json,sys; d=json.load(sys.stdin); print(json.dumps([{'head_sha':r['head_sha'],'conclusion':r['conclusion']} for r in d.get('workflow_runs',[])]))" 2>/dev/null)
          [ -z "$RUNS" ] && RUNS="[]"
          OUT=$(python stability_gate.py --ci-evidence "$RUNS")
          echo "$OUT"
          echo "$OUT" | grep '^CI_EVIDENCE=' >> $GITHUB_ENV
          set -e

      - name: 비밀번호 파일(secret.json) 만들기
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: echo "$GCP_CREDENTIALS" > secret.json

      - name: 파이썬 실행!
        env:
          # 💡 [핵심 패치] 파이썬이 실행될 때 깃허브 금고에서 열쇠를 꺼내어 쥐여줍니다!
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }} 
          # 🔴 2026-09-18 — 이 둘이 빠져 있어서 omakase 의 실시간 알림이
          #    조용히 꺼져 있었다(목표가 도달·트레일링 손절, 호출 3곳).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # 🔴 2026-09-18 지시 ② — Stability Gate 의 `ci_green` 은 사람이 넣지 않는다.
          #    이 커밋(SHA)의 audit CI 결론을 영수증에 실어 Evidence Builder 가 읽는다.
          CI_CONCLUSION: ${{ env.CI_EVIDENCE }}
        run: python omakase.py

      # 🔴 2026-09-20 — **비차단.** 연구 자료 수집이 주 산출물 판정을 흐리지 않는다.
      #    여기서 exit 1 을 내면 main.yml run 이 failure 가 되고, evidence_builder 의
      #    no_unexplained_failure 가 그 결론을 보고 **그 거래일을 FAIL** 로 만든다.
      #    영수증 생성 회차(EOD 15:00~15:30)와 배지 창(14:20~15:10)이 15:00~15:10 에서
      #    겹치므로 실제로 닿는 경로다. consensus_aux 분리와 같은 범주의 규율이다.
      #    실패는 배지 자체 상태(upload_status.json.gz)와 ::warning:: 에 남는다.
      - name: 배지 조합 관측 보존 (비공개 원자료 · 비차단 · 결과와 분리)
        if: always()
        # 셸 가드는 **마지막 한 겹**이다. 모듈 로드 실패(문법 오류·의존성 부재)는
        # 파이썬 코드가 돌기 전이라 모듈 안에서 막을 수 없다. 그 경우까지 덮는다.
        # 조용히 삼키지 않는다 — 경고를 남기고 스텝만 초록으로 둔다.
        run: |
          if ! python badge_observations.py --upload; then
            echo "::warning::[배지 수집 실패] 수집기가 기동하지 못했다(모듈 로드 등) — 배지 실패만으로 주 시스템을 실패 처리하지 않는다"
          fi

      - name: 데이터 품질표 연결 검사 (원장 읽기 전용)
        if: always()
        run: python hyeoks_data_quality.py --check --spreadsheet-id 1BcZ2HtkjlArbEGcRcMo8uKG1-ZQ-kv0RvNiiLJFQzks

      # 🧳 2026-10-13 — 스캐너 증거 사본(A). 아래 커밋 단계가 실패해도(9/18 14:41·14:51 유형)
      #    이 회차가 만든 영수증·Feature Store·전수조사 파일이 artifact 로 14일 남는다.
      #    판정에 쓰지 않는다(사용자 결정 C-b). 되살리기는 manifest 로 출처를 검증하는 별도 도구(B)가 한다.
      #    🔴 두 단계가 실패해도 run 결론은 success 여야 한다 — Evidence Builder 가 scanner 영수증의
      #    run 결론으로 no_unexplained_failure 를 정한다(Codex 10/13 P2). 그래서 continue-on-error·짧은 상한.
      #    사본은 저장소 밖($RUNNER_TEMP)에 만들고 세 폴더의 변경 파일만 담는다 — secret.json 이 섞이지 않는다.
      # 🔒 2026-10-25 — 후보 자료(Feature Store · 순위 풀)는 공개 저장소 · artifact 에 남기지 않는다(허브 §8,
      #    Codex 검토 P1, 사용자 결정). 러너가 쓴 파일을 드라이브(비공개)로 올리고 공개에는 건수 색인
      #    data/scanner_census/private_index.csv 만 남긴다. 업로드가 실패해도 회차를 실패로 만들지 않는다 —
      #    색인에 '실패' 가 남고 같은 날 뒤 회차가 다시 기록해 올린다. 창 밖 회차는 새 자료가 없어 바로 끝난다.
      - name: 🔒 후보 자료 비공개 보관 (드라이브)
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: python private_store.py --upload

      # 🔒 2026-10-25 전체 검토 A — 업로드에 실패한 원본은 AES-256 으로 봉인돼 .private_fallback/ 에 있다(키 없이는 못 읽음).
      #    스캐너는 첫 적재 회차에서만 후보 자료를 만들어 뒤 회차가 다시 만들 수 없으므로, 같은 바이트를 14일 남긴다.
      #    복구: artifact 를 내려받아 PC 에서 `python private_store.py --restore <폴더>`(사용자 환경 변수 PRIVATE_STORE_KEY).
      - name: 🔒 업로드 못 한 후보 자료 봉인 사본 보관 (14일)
        if: always() && hashFiles('.private_fallback/manifest.json') != ''
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v7
        with:
          name: private-fallback-${{ github.run_id }}-${{ github.run_attempt }}
          path: .private_fallback
          retention-days: 14
          if-no-files-found: ignore

      - name: 🧳 스캐너 증거 사본 준비
        id: evidence
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: python .github/evidence_snapshot.py --out "$RUNNER_TEMP/scanner-evidence"

      - name: 🧳 스캐너 증거 사본 올리기 (14일 보존)
        if: always() && steps.evidence.outputs.files != '' && steps.evidence.outputs.files != '0'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.evidence.outputs.name }}
          path: ${{ runner.temp }}/scanner-evidence
          retention-days: 14
          if-no-files-found: ignore

      - name: 📊 타점 전수조사·후보 동결 보존
        # 스캐너는 10분마다 돌지만 기록은 하루 한 줄이다(14:40~15:10 KST, 날짜 멱등).
        # 그래서 이 스텝은 하루 144회 중 **1회만** 실제로 커밋하고 나머지는 즉시 끝난다.
        # 왜 남기나: 엔벨로프 통과 수는 지금까지 로그에만 있었고 로그는 만료된다.
        # §3-2-1 의 ENVELOPE_BAND 를 켜면 이 값이 바뀌므로 켜기 전 기준선이 필요하다.
        if: always()
        run: |
          # 🔴 2026-09-18 — 어제 여기에 data/feature_store 를 더했는데 그 디렉터리는
          #    아직 저장소에 없었다. `git status` 는 없는 경로에 조용하지만
          #    `git add -- <없는 경로>` 는 exit 128 로 죽는다. 그래서 9/18 14:41·14:51
          #    두 회차가 **전수조사 한 줄을 커밋하지 못하고 워크플로째 실패**했다.
          #    기록 창은 14:40~15:10 뿐이다 — 계속 실패했으면 그날치를 통째로 잃었다.
          #    관측을 남기려다 수집기를 죽이지 않는다. 경로를 먼저 만들어 둔다.
          # 🔒 2026-10-25 — data/feature_store · data/scanner_census/rank_pool.csv 는 .gitignore(드라이브 비공개).
          #    여기서는 건수 색인 · 전수조사 · 영수증만 커밋한다.
          mkdir -p data/scanner_census data/receipts
          if [ -z "$(git status --porcelain data/scanner_census data/receipts)" ]; then
            echo "기록 없음 (창 밖이거나 오늘치 이미 있음)"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- data/scanner_census data/receipts
          git commit -m "data: 타점 전수조사·후보 동결 $(TZ=Asia/Seoul date +%Y-%m-%d) [skip ci]"
          # 스냅샷·분봉 워크플로가 같은 시간대에 푸시할 수 있으므로 rebase 후 재시도
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "⚠️ 푸시 재시도 $i/3"
            sleep 5
          done
          echo "::error::타점 전수조사 푸시가 끝내 실패했다"
          exit 1
