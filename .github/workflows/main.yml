name: Stock Omakase Auto Scraper

on:
  workflow_dispatch: # 구글 GAS가 쏘는 신호만 받음 (시간 없음)
  
concurrency:
  group: hyeoks-sheet-lock # 💡 퍼블리셔와 똑같은 이름으로 맞춥니다!
  cancel-in-progress: false

permissions:
  contents: write   # 타점 전수조사 한 줄을 커밋하기 위해서만 쓴다 (아래 마지막 스텝)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 17  # 💡 [하드 백스톱] 코드 내 15분 자체 데드라인이 어떤 이유로든 안 걸리면 GitHub가 강제 종료 → 다음 대기열이 밀리지 않게 보장
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # P1-1 — 지문 증거가 `git diff <sha>..HEAD` 를 쓴다

      - name: 파이썬 설치하기
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: 라이브러리 설치하기
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas gspread oauth2client kiwipiepy

      - name: 🚦 지문 기준 audit CI 증거 (P1-1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 🔴 P1-1 — HEAD SHA 로 찾으면 데이터 전용 커밋([skip ci]) 뒤에는 CI 가
          #    없어서 정상 코드인데도 증거가 사라진다. 매일 데이터가 커밋되므로
          #    사실상 항상 거짓이 된다. 증명할 것은 "지금 **지문**이 CI 를 통과했나" 다.
          set +e
          RUNS=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/review_regressions.yml/runs?status=success&branch=main&per_page=10" \
            | python -c "import json,sys; d=json.load(sys.stdin); print(json.dumps([{'head_sha':r['head_sha'],'conclusion':r['conclusion']} for r in d.get('workflow_runs',[])]))" 2>/dev/null)
          [ -z "$RUNS" ] && RUNS="[]"
          OUT=$(python stability_gate.py --ci-evidence "$RUNS")
          echo "$OUT"
          echo "$OUT" | grep '^CI_EVIDENCE=' >> $GITHUB_ENV
          set -e

      - name: 비밀번호 파일(secret.json) 만들기
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: echo "$GCP_CREDENTIALS" > secret.json

      - name: 파이썬 실행!
        env:
          # 💡 [핵심 패치] 파이썬이 실행될 때 깃허브 금고에서 열쇠를 꺼내어 쥐여줍니다!
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }} 
          # 🔴 2026-09-18 — 이 둘이 빠져 있어서 omakase 의 실시간 알림이
          #    조용히 꺼져 있었다(목표가 도달·트레일링 손절, 호출 3곳).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # 🔴 2026-09-18 지시 ② — Stability Gate 의 `ci_green` 은 사람이 넣지 않는다.
          #    이 커밋(SHA)의 audit CI 결론을 영수증에 실어 Evidence Builder 가 읽는다.
          CI_CONCLUSION: ${{ env.CI_EVIDENCE }}
        run: python omakase.py

      - name: 배지 조합 관측 보존 (비공개 원자료, 결과와 분리)
        if: always()
        run: python badge_observations.py --upload

      - name: 데이터 품질표 연결 검사 (원장 읽기 전용)
        if: always()
        run: python hyeoks_data_quality.py --check --spreadsheet-id 1BcZ2HtkjlArbEGcRcMo8uKG1-ZQ-kv0RvNiiLJFQzks

      - name: 📊 타점 전수조사·후보 동결 보존
        # 스캐너는 10분마다 돌지만 기록은 하루 한 줄이다(14:40~15:10 KST, 날짜 멱등).
        # 그래서 이 스텝은 하루 144회 중 **1회만** 실제로 커밋하고 나머지는 즉시 끝난다.
        # 왜 남기나: 엔벨로프 통과 수는 지금까지 로그에만 있었고 로그는 만료된다.
        # §3-2-1 의 ENVELOPE_BAND 를 켜면 이 값이 바뀌므로 켜기 전 기준선이 필요하다.
        if: always()
        run: |
          # 🔴 2026-09-18 — 어제 여기에 data/feature_store 를 더했는데 그 디렉터리는
          #    아직 저장소에 없었다. `git status` 는 없는 경로에 조용하지만
          #    `git add -- <없는 경로>` 는 exit 128 로 죽는다. 그래서 9/18 14:41·14:51
          #    두 회차가 **전수조사 한 줄을 커밋하지 못하고 워크플로째 실패**했다.
          #    기록 창은 14:40~15:10 뿐이다 — 계속 실패했으면 그날치를 통째로 잃었다.
          #    관측을 남기려다 수집기를 죽이지 않는다. 경로를 먼저 만들어 둔다.
          mkdir -p data/scanner_census data/feature_store data/receipts
          if [ -z "$(git status --porcelain data/scanner_census data/feature_store data/receipts)" ]; then
            echo "기록 없음 (창 밖이거나 오늘치 이미 있음)"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- data/scanner_census data/feature_store data/receipts
          git commit -m "data: 타점 전수조사·후보 동결 $(TZ=Asia/Seoul date +%Y-%m-%d) [skip ci]"
          # 스냅샷·분봉 워크플로가 같은 시간대에 푸시할 수 있으므로 rebase 후 재시도
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "⚠️ 푸시 재시도 $i/3"
            sleep 5
          done
          echo "::error::타점 전수조사 푸시가 끝내 실패했다"
          exit 1
