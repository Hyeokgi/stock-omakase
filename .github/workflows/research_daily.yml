name: 🧭 HYEOKS 연구 일일 (일봉 · [연구] 보고)

# 목적: 테마·대장 후속 경로 연구(docs/collaboration/2026-10-04_*)의 확정 일봉을 저장소에 쌓고,
#       기존 텔레그램 채널에 `[연구]` 머리말로 일일 보고를 보낸다. 사용자 지시 2026-10-04.
# 2026-10-05 개정: Codex 교차 검토 R1~R6 반영(018042b).
# 2026-10-05 개정②: Codex 후속 권고 + 사용자 지시 — **가격 원자료는 공개 저장소에 커밋하지 않는다.**
#       봉·종목별 상태는 구글 드라이브(비공개, 동결 번들과 같은 쓰기 전용 창구)로 올리고,
#       공개 저장소에는 data/research_runs/ 의 건수·상태·파일 이름 요약만 커밋한다.
#       드라이브는 읽을 수 없어 매 실행 300봉 창을 새로 받는 상태 없는 수집이다.
#
# 🔒 보고에는 수집 상태와 구조 집계만 담는다. 대장 후보의 이후 수익률은 넣지 않는다 —
#    잠긴 사전등록 leader-hold-v1 의 확증 구간(진입일 ≥ 2026-10-06)과 겹치기 때문이다.
# 관측 전용: 주문·시트 쓰기·선정 조건 변경 없음. 이 워크플로는 안정화 지문 대상이 아니고,
#    연구 상태(OK/DEGRADED/FAILED)는 생산 Gate 에 연결하지 않는다.
#
# 시각: 평일 19:40 KST. 주 발사는 GAS(triggerResearchDaily, 2026-10-05 추가), 깃허브 예약은 백업이다 —
#       깃허브 예약은 늦거나 빠질 수 있다(정시 보장 아님). 둘 다 오면 뒤 실행은 같은 대상일을 다시 하지 않는다.
#       대상일 = 실행 시각 기준 가장 최근에 장이 확정된(16:00 이후) 거래일. 빠진 날은 종목별 범위로 다음 실행이 메운다.
#       평일 휴장일 저녁의 예약 실행은 같은 거래일을 다시 보고하지 않도록 건너뛴다.
# 시간 예산을 넘기면 멈춘 위치를 data/research_runs/resume.json 에 남기고 다음 실행이 잇는다.
# 등록 상태: 첫 실행 미확인(2026-10-05 기준). 원격 저장과 텔레그램 도착을 한 번 확인하기 전에는 '가동 확인' 이라 쓰지 않는다.

on:
  workflow_dispatch:
    inputs:
      date:
        description: '대상 거래일 YYYY-MM-DD (비우면 오늘 — 자정 이후 도착이면 전날)'
        required: false
        default: ''
      send:
        description: '텔레그램 [연구] 보고 발송'
        type: boolean
        default: true
  schedule:
    - cron: '40 10 * * 1-5'   # 19:40 KST

permissions:
  contents: write

concurrency:
  group: research-daily
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40   # 도구 자체 시간 예산 20분 — 저장·커밋·보고 시간을 남긴다

    steps:
    - name: 📥 코드·스냅샷 가져오기
      uses: actions/checkout@v7

    - name: 🐍 파이썬 세팅
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: 📦 의존성
      run: pip install requests

    - name: 📈 확정 일봉 수집 (원자료 → 드라이브 비공개)
      id: bars
      env:
        TARGET_DATE: ${{ github.event.inputs.date }}
      run: |
        mkdir -p data/research_runs
        python hyeoks_research_daily.py --bars ${TARGET_DATE:+--date "$TARGET_DATE"}

    # 수집이 FAILED 로 끝나도 공개 요약(건수·상태·파일 이름 — 가격 없음)은 남긴다.
    - name: 💾 공개 요약 커밋
      id: archive
      if: always()
      run: |
        mkdir -p data/research_runs
        if [ -z "$(git status --porcelain data/research_runs)" ]; then
          echo "ℹ️ 바뀐 파일 없음 — 커밋 생략"
          echo "result=변경 없음" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data/research_runs
        git commit -m "data: 연구 수집 요약 $(TZ=Asia/Seoul date +%Y-%m-%d) run ${GITHUB_RUN_ID} [skip ci]"
        for i in 1 2 3; do
          if git pull --rebase --autostash origin main && git push origin HEAD:main; then
            echo "result=원격 반영 $(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "⚠️ 푸시 재시도 $i/3"
          sleep 5
        done
        echo "result=원격 반영 실패 (요약만 — 원자료는 드라이브)" >> "$GITHUB_OUTPUT"
        echo "::error::공개 요약 커밋 푸시 실패"
        exit 1

    - name: 📨 [연구] 일일 보고
      if: always()
      env:
        TARGET_DATE: ${{ github.event.inputs.date }}
        SEND: ${{ github.event_name == 'schedule' || github.event.inputs.send == 'true' }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        RESEARCH_ARCHIVE: ${{ steps.archive.outputs.result || '커밋 단계 결과 없음' }}
      run: |
        ARGS="--report"
        if [ "$SEND" = "true" ]; then ARGS="$ARGS --send"; fi
        rc=0   # 기본 셸이 -eo pipefail 이라 실패를 받아 둔 뒤 요약을 쓰고 끝에서 돌려준다
        python hyeoks_research_daily.py $ARGS ${TARGET_DATE:+--date "$TARGET_DATE"} | tee research_report.txt || rc=$?
        { echo "## 🧭 [연구] 일일 보고"; echo; echo '```'; cat research_report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        exit $rc
