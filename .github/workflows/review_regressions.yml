name: Audit regressions (offline)

on:
  push:
    paths:
      - 'hyeoks_verdict.py'
      - 'hyeoks_nightly.py'
      - 'nightly_quotes.py'
      - 'account_source_adapter.py'
      - 'tests/**'
      - '.github/workflows/review_regressions.yml'
  pull_request:
    paths:
      - 'hyeoks_verdict.py'
      - 'hyeoks_nightly.py'
      - 'nightly_quotes.py'
      - 'account_source_adapter.py'
      - 'tests/**'
      - '.github/workflows/review_regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test without credentials or paid APIs
        run: |
          python -m unittest discover -s tests
          python hyeoks_verdict.py --self-test
          python account_source_adapter.py --self-test
          python hyeoks_run_freeze.py --self-test
          python test_tajeom.py
