name: Audit regressions (offline)

on:
  push:
    paths:
      - 'omakase.py'
      - 'after_market_quotes.py'
      - 'hyeoks_analyst.py'
      - 'hyeoks_performance_memory.py'
      - 'hyeoks_verdict.py'
      - 'hyeoks_closing_bet.py'
      - 'scanner_census.py'
      - 'hyeoks_sheet_probe.py'
      - 'omakase.py'
      - 'closing_study.py'
      - 'hyeoks_trading_calendar.py'
      - 'hyeoks_market_snapshot.py'
      - 'data/market_snapshot/nontrading.txt'
      - 'data/market_snapshot/calendar_scope.json'
      - 'hyeoks_nightly.py'
      - 'nightly_quotes.py'
      - 'account_source_adapter.py'
      - 'tests/**'
      - '.github/workflows/review_regressions.yml'
  pull_request:
    paths:
      - 'omakase.py'
      - 'after_market_quotes.py'
      - 'hyeoks_analyst.py'
      - 'hyeoks_performance_memory.py'
      - 'hyeoks_verdict.py'
      - 'hyeoks_closing_bet.py'
      - 'scanner_census.py'
      - 'hyeoks_sheet_probe.py'
      - 'omakase.py'
      - 'closing_study.py'
      - 'hyeoks_trading_calendar.py'
      - 'hyeoks_market_snapshot.py'
      - 'data/market_snapshot/nontrading.txt'
      - 'data/market_snapshot/calendar_scope.json'
      - 'hyeoks_nightly.py'
      - 'nightly_quotes.py'
      - 'account_source_adapter.py'
      - 'tests/**'
      - '.github/workflows/review_regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Test without credentials or paid APIs
        run: |
          python -m unittest discover -s tests
          python hyeoks_verdict.py --self-test
          python hyeoks_closing_bet.py --self-test
          python hyeoks_sheet_probe.py --self-test
          python account_source_adapter.py --self-test
          python hyeoks_run_freeze.py --self-test
          python test_tajeom.py
