name: 🎯 HYEOKS 백테스트 저녁 보완 (추적 캐치업 + 익절·손절 터치)

on:
  schedule:
    # KST 매일 21:00 (12:00 UTC), 평일. omakase(GAS가 07:00~19:59 10분마다 디스패치)와
    # analyst(20:05 회차)가 모두 끝난 뒤라 백테스트_로그 동시 재정렬과 겹치지 않는다.
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

concurrency:
  group: hyeoks-sheet-lock    # 백테스트_로그를 쓰는 omakase(main.yml)와 동일 그룹 — 동시 쓰기 차단
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread oauth2client

      - name: 인증 파일(secret.json) 생성
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: echo "$GCP_CREDENTIALS" > secret.json

      # omakase의 Step2 추적은 아침(07:00~08:50)에만 돌아서, 그 시각엔 '오늘 일봉'이 없어
      # 오늘 도달한 호라이즌이 항상 다음 날로 밀린다. 장 마감 후 한 번 더 채워 하루 앞당긴다.
      - name: 추적 캐치업 (진입가 · 종목/지수 T+N)
        run: python hyeoks_track_catchup.py --apply

      - name: 익절·손절 터치 계산 및 기록
        if: always()          # 캐치업이 실패해도 터치 추적은 독립적으로 시도
        run: python hyeoks_touch_tracker.py --apply
