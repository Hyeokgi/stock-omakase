name: 🛡️ HYEOKS 스냅샷 결측 감시

# 목적: 종가베팅 검증의 원재료가 조용히 사라지는 것을 막는다.
#       시장 스냅샷은 '그 시각의 값'이라 사후 복원이 **불가능**하고,
#       분봉은 네이버가 최근 6거래일치만 주므로 6일이 지나면 소멸한다.
#
# 왜 필요한가 — 지금은 실패해도 아무도 모른다.
#   스냅샷 트리거는 GAS 하나뿐이고 cron 폴백이 없다. 분봉은 깃허브 cron 인데
#   2026-08-27 실측으로 4시간 54분 지연·드롭이 있었다. 그리고 '워크플로가 아예 안 돈 것'은
#   빨간 실행조차 남기지 않아서, 한 달 뒤 분석할 때가 돼서야 구멍을 발견하게 된다.
#   그때는 이미 복구 불가다. 이 워크플로는 매일 그걸 대신 세어 준다.
#
# 관측 전용: 구글시트를 읽지도 쓰지도 않고, 아무것도 커밋하지 않는다.
#            스스로 메우지도 않는다 — 메울지는 사람이 로그를 보고 결정한다
#            (자동 백필은 '언제 받은 값인지'를 흐려 표본을 오염시킨다).
#
# 잡이 빨개지는 조건: 복구 불가 구멍이 생겼거나, 복구 가능한 구멍이 남아 있을 때.
#                     빨간색 = "오늘 안에 사람이 봐야 한다"는 뜻이다.

on:
  schedule:
    - cron: '0 14 * * 1-5'   # 평일 23:00 KST. 그날 수집이 전부 끝난 뒤.
  workflow_dispatch:
    inputs:
      days:
        description: '거슬러 볼 거래일 수 (기본 20)'
        required: false
        default: '20'
        type: string

concurrency:
  group: hyeoks-snapshot-watch
  cancel-in-progress: false

permissions:
  contents: read              # 읽기만 한다. 커밋하지 않는다.

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: 📥 코드 가져오기
      uses: actions/checkout@v4

    - name: 🐍 파이썬 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: 🧪 판정 로직 자기검증
      # 네트워크 없이 표·판정·종료코드가 맞는지 먼저 본다.
      # 있는 날 + 없는 날을 섞어 주면 반드시 '복구 불가'(2)가 나와야 한다.
      run: |
        set +e
        WATCH_TEST_DAYS="2026-08-28,2099-01-01" python hyeoks_snapshot_watch.py > /tmp/selftest.txt 2>&1
        code=$?
        cat /tmp/selftest.txt
        if [ "$code" != "2" ]; then
          echo "❌ 자기검증 실패: 결측이 있는데 종료코드가 $code (2 여야 함)"
          exit 1
        fi
        echo "✅ 자기검증 통과 — 결측을 결측으로 센다"

    - name: 🛡️ 결측 감시
      id: watch
      run: |
        set +e
        python hyeoks_snapshot_watch.py --days "${{ inputs.days || '20' }}" 2>&1 | tee watch.txt
        echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        exit 0

    - name: 📋 로그 보관
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: snapshot-watch-log
        path: watch.txt
        retention-days: 90

    - name: 🚦 구멍이 있으면 잡을 실패시킨다
      run: |
        code="${{ steps.watch.outputs.exit_code }}"
        if [ "$code" = "2" ]; then
          echo "❌ 복구 불가 구멍이 있거나 감시 자체가 실패했다 — 로그를 즉시 확인할 것"
          exit 1
        fi
        if [ "$code" = "1" ]; then
          echo "⚠️ 아직 메울 수 있는 구멍이 있다 — 6거래일이 지나기 전에 백필할 것"
          exit 1
        fi
        echo "✅ 구멍 없음"
