name: 🌇 HYEOKS 종가베팅 관측

# 목적: 15:05 슬롯 진입 → **익일 시가 전량 청산**의 오후수급 Q5 효과를 사전등록대로 잰다.
#       사전등록은 전략로드맵 §6-12 · §6-12-2 · §6-12-3 · §6-12-5 · §6-12-6 에 있다.
#
# 읽기 전용: `data/market_snapshot/*.csv.gz` 만 읽는다.
#            구글시트도, 네트워크도, 자격증명도 쓰지 않는다. 락 그룹이 필요 없는 이유다.
#
# 수동 전용: cron 이 없다. phase2_exit.yml 과 같은 이유다 — 자동화하면 '결과를 매일 보는'
#            습관이 생기고, 그게 §3 사전등록 규율이 막으려는 바로 그 행동이다.
#            그리고 분석기 스스로도 단계 잠금(§6-12-6 ⑧)으로 같은 것을 막는다:
#            성숙 거래일이 20일에 닿기 전에는 **수익률을 계산조차 하지 않는다.**

on:
  workflow_dispatch:
    inputs:
      stdout_only:
        description: '파일로 쓰지 않고 화면에만 (커밋 안 함)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  closing-bet:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: 📥 코드 가져오기
      uses: actions/checkout@v7

    - name: 🐍 파이썬 세팅
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: 🧪 분석기 자기검증
      # 깨진 분석기로 돌리면 틀린 숫자를 기록에 남긴다. 파이프를 쓰지 않는다 —
      # 종료코드가 삼켜진다.
      run: python hyeoks_closing_bet.py --self-test

    - name: 🌇 관측
      run: |
        python hyeoks_closing_bet.py \
          ${{ inputs.stdout_only && '--stdout-only' || '' }}

    - name: 📌 기록 커밋
      if: ${{ !inputs.stdout_only }}
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/종베관측_현황.md docs/종베판정_*.md 2>/dev/null || true
        if git diff --staged --quiet; then
          echo "바뀐 기록 없음"
          exit 0
        fi
        git commit -m "docs: 종베 관측 $(date -u +%Y-%m-%d) [skip ci]"
        for i in 2 4 8 16; do
          git push && exit 0
          echo "푸시 실패 — ${i}초 뒤 재시도"
          sleep $i
        done
        echo "::error::푸시가 끝내 실패했다"
        exit 1
