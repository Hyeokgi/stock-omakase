name: 🏢 기업정보 신규 상장 동기화 (KIND)

on:
  schedule:
    - cron: '20 22 * * 0-4'   # KST 평일 07:20 (UTC 전날 22:20, 일~목) — 장 시작 · 스캐너 전
  workflow_dispatch:
    inputs:
      dry_run:
        description: '시험 실행(개수만 보고 쓰지 않음)'
        type: boolean
        default: false

concurrency:
  group: hyeoks-company-info-lock   # 기업정보 탭의 유일한 writer(다른 코드는 읽기만)
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v7

      - name: 파이썬 설치
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread oauth2client

      - name: 비밀번호 파일(secret.json) 생성
        env:
          CREDENTIAL_JSON: ${{ secrets.GCP_CREDENTIALS }}
        run: python -c 'import os,json,pathlib; pathlib.Path("secret.json").write_text(json.dumps(json.loads(os.environ["CREDENTIAL_JSON"])), encoding="utf-8")'

      - name: 기업정보 동기화
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then python hyeoks_company_info.py --dry-run; else python hyeoks_company_info.py; fi

      - name: 비밀번호 파일 지우기
        if: always()
        run: python -c 'from pathlib import Path; Path("secret.json").unlink(missing_ok=True)'
