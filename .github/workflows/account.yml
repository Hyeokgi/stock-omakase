name: Account NAV (frozen input, restricted output)

on:
  workflow_dispatch:
    inputs:
      input_file_id:
        description: 'Private Drive account-input-v2 JSON file ID'
        required: true
        type: string
      output_folder_id:
        description: 'Restricted My Drive folder writable by the OAuth user (no public/domain/group ACL)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: account-nav-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  account:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test pure engine and mocked storage
        run: python hyeoks_account.py --self-test
      - name: Install authenticated storage client
        run: pip install 'google-api-python-client>=2,<3' 'google-auth>=2,<3'
      - name: Credentials
        env:
          ACCOUNT_DRIVE_OAUTH: ${{ secrets.ACCOUNT_DRIVE_OAUTH }}
        run: |
          umask 077
          printf '%s' "$ACCOUNT_DRIVE_OAUTH" > secret.json
      - name: Read frozen input
        env:
          INPUT_FILE_ID: ${{ inputs.input_file_id }}
        run: |
          umask 077
          python account_drive.py download --id "$INPUT_FILE_ID" --path account_input_private.json
      - name: Calculate and locally verify evidence bundle
        run: |
          umask 077
          python hyeoks_account.py --input account_input_private.json --output-dir data/account_private
      - name: Preserve and verify private evidence
        env:
          OUTPUT_FOLDER_ID: ${{ inputs.output_folder_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          runs=(data/account_private/*/COMPLETE)
          if [ "${#runs[@]}" -ne 1 ]; then exit 1; fi
          run_dir="$(dirname "${runs[0]}")"
          python account_drive.py upload --id "$OUTPUT_FOLDER_ID" --path "$run_dir"
      - name: Remove credential file
        if: always()
        run: rm -f secret.json
      # No git commit/push and no public artifact upload of ledger, prices or report.
      # A green job requires remote upload, explicit-user ACL and content readback.
