name: 💰 HYEOKS 계좌 수준 성과

# 목적: 로드맵 §4-5 가 요구한 **계좌 관점** 산출물.
#       §3 은 행 단위 평균 순알파를 재는데 그건 계좌 수익률이 아니다.
#       자금 배분·보유 중첩·집중도·MDD 를 같은 원장으로 다시 본다.
#
# 읽기 전용: 구글시트를 **읽기만** 한다. 그래도 락은 메인 스캐너와 공유한다
#            (omakase 가 갱신하는 도중에 읽으면 절반만 갱신된 상태를 볼 수 있다).
#
# 수동 전용: cron 없음. 계좌 지표를 매일 보면 그 자체가 판단을 흐린다(§0).

on:
  workflow_dispatch:
    inputs:
      stdout_only:
        description: '파일로 저장하지 않고 화면에만'
        required: false
        default: false
        type: boolean

concurrency:
  group: hyeoks-sheet-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  account:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: 📥 코드 가져오기
      uses: actions/checkout@v4

    - name: 🐍 파이썬 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install gspread oauth2client

    - name: 🧪 계좌 산출기 자기검증
      # 여기서 깨지면 숫자를 신뢰할 수 없으므로 시트를 건드릴 이유가 없다.
      run: python hyeoks_account.py --self-test

    - name: 🔑 비밀번호 파일(secret.json) 만들기
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      run: echo "$GCP_CREDENTIALS" > secret.json

    - name: 💰 계좌 성과 산출
      id: run
      run: |
        set +e
        FLAG=""
        if [ "${{ inputs.stdout_only }}" = "true" ]; then FLAG="--stdout-only"; fi
        python hyeoks_account.py $FLAG 2>&1 | tee account.txt
        echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        exit 0

    - name: 🧹 자격증명 삭제
      if: always()
      run: rm -f secret.json

    - name: 📋 실행 로그 보관
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: account-log
        path: account.txt
        retention-days: 90

    - name: 💾 리포트 커밋
      if: ${{ inputs.stdout_only != true }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/account/ || true
        git diff --staged --quiet || git commit -m "data: 계좌 수준 성과 $(date -u +%Y-%m-%d) [skip ci]"
        git push || true

    - name: 🚦 실패 시 잡 실패 처리
      run: |
        if [ "${{ steps.run.outputs.exit_code }}" != "0" ]; then
          echo "❌ 계좌 산출기가 0이 아닌 코드로 종료했습니다"
          exit 1
        fi
        echo "✅ 정상 종료"
