[assets]
directory = "./public"
binding = "ASSETS"

# 🆕 2026-10-29 GAS 예열 — 평일 KST 08:00~19:55 5분마다(UTC 23시 일~목 · 00~10시 월~금)
[triggers]
# Cloudflare 요일은 1~7(일=1)이라 0 을 쓰면 배포가 거부된다(10-29~10-30 main 배포 5회 실패) — 이름으로 쓴다.
crons = ["*/5 23 * * SUN-THU", "*/5 0-10 * * MON-FRI"]
