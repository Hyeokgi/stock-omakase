name = "stock-omakase"
main = "src/index.js"
compatibility_date = "2026-01-01"

[assets]
directory = "./public"
binding = "ASSETS"

# 2026-10-30 GAS 예열 cron 은 뺐다. 무료 계정은 cron 이 계정 전체 5개까지인데 다른 Worker(teum-reservation 등)가
# 이미 다 써서 배포가 'Trigger configuration ... only partially updated' 로 실패 표시됐다(코드 업로드는 매번 성공).
# 첫 접속 속도는 응답 캐시(SWR)와 브라우저 저장본으로 충분하다. src 의 scheduled() 는 cron 을 다시 켤 때를 위해 남긴다.
